<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>工作台启动中</title>
    <script>
      // 加载态窗口也跟随壳的主题偏好（和自绘标题栏同一套真值）。这页在壳自己的
      // origin 上，与主面板共用 localStorage；运行中切主题时，Rust 的
      // `push_shell_theme` 会往 label 为 harness 的这扇窗 eval 一个
      // `dsh-shell-theme` 事件，收到就重画。读不到偏好时保持深色——与建窗底色
      // 同值，脚本失败只会退回现状，不会先闪一屏白。
      (function () {
        var KEY = 'dsh-xlink:ui-theme'; // 与 ui/src/shell/theme.js 的 STORAGE_KEY 同一份约定
        var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        function read() {
          try {
            var raw = window.localStorage && window.localStorage.getItem(KEY);
            return raw === 'light' || raw === 'system' ? raw : 'dark';
          } catch (_) {
            return 'dark';
          }
        }
        var preference = read();
        function paint() {
          var light = preference === 'light' || (preference === 'system' && media && !media.matches);
          document.documentElement.classList.toggle('light', light);
        }
        window.addEventListener('dsh-shell-theme', function (event) {
          var next = event && event.detail;
          preference = next === 'light' || next === 'dark' ? next : 'system';
          paint();
        });
        if (media && media.addEventListener) {
          media.addEventListener('change', paint);
        }
        paint();
      })();
    </script>
    <style>
      /* 深浅两套对应工作台页面自己的底色：深 #16171a（与 shell::window::CHROME_BACKDROP
         同值）/ 浅色页面的白。默认深色，浅色由上面的脚本挂 `html.light`——脚本
         失败时保持现状，不会白屏。 */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #16171a;
        color: #d8dade;
        font: 14px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      html.light body {
        background: #ffffff;
        color: #1f2328;
      }
      .box {
        text-align: center;
        max-width: 420px;
        padding: 0 24px;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 18px;
        border: 3px solid rgba(216, 218, 222, 0.16);
        border-top-color: #609926;
        border-radius: 50%;
        animation: spin 900ms linear infinite;
      }
      html.light .spinner {
        border-color: rgba(31, 35, 40, 0.16);
        border-top-color: #609926;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- 这段文字是必须的，不是装饰：harness-health.js 的空白判据读的是
         body.innerText，页面上没有可见文字就会被当成「工作台白屏」报一桩
         假事故（加载态页面本来就没有内核 DOM，空白是它的正常样子）。 -->
    <div class="box">
      <div class="spinner" role="status" aria-label="内核启动中"></div>
      <h1>内核启动中…</h1>
    </div>
  </body>
</html>
