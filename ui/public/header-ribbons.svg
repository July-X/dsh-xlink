<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" preserveAspectRatio="xMaxYMin slice" fill="none">
  <!--
    页头缎带（设计稿 2026-10-10 的深色稿）。

    形状取自设计稿右上角那一条 S 形丝带：左端低而平（先微微下沉），中段陡然抬升，
    右端收敛收窄并冲出画面右上角；带上沿有一道更亮的发光描边，下方拖一层更宽更暗
    的色带做出厚度。**它不是一团径向光晕**：先前按 token 规范的 header glow 做成
    radial-gradient(ellipse at 85% 0%)，渲染出来是一个没有边缘的椭圆色块，与稿子里
    「有明确上边缘曲线的丝带」是两回事。

    画成独立 SVG 文件而不是 CSS 渐变，原因就是形状：CSS 画不出「一条上下两条边界、
    边界自身是 S 形」的封闭色带，用多层渐变去凑只会得到渐隐的边而不是收口的边。

    viewBox 1200x220，preserveAspectRatio="xMaxYMin slice"：右对齐 + 顶部对齐，
    所以窗口变宽时丝带贴着右上角不变形、不居中，稿子里它就是靠右的一角装饰，
    居中会跑到「概览」标题正上方去。

    **颜色写死，不走 currentColor**：这个文件经 background-image 的 url() 引用，
    那条路上没有 color 继承，currentColor 会解析成黑色，整块缎带变成黑影。
    亮色主题需要更淡的一档，但那时整条缎带已被 opacity 一起压掉（见 theme.css），
    不必也不该在这里再分叉一套颜色。

    **注释里不许出现连续的连字符**：XML 把两个连字符当成注释终止符，中文破折号
    与 token 名里那两处连字符都会让整个文件变成非法 XML，浏览器静默不渲染它。
  -->
  <g>
    <!-- 后层：更宽、铺得更低，在主带下方拖出厚度。末端收得更靠右，让主带压在上面。 -->
    <path
      d="M0 220 C 240 214, 420 196, 580 168 C 730 142, 850 110, 970 80 C 1060 58, 1120 42, 1200 22 L 1200 220 Z"
      fill="#4a91ff"
      fill-opacity="0.13"
    />
    <!-- 主缎带：上边缘走 S 形。左端贴着画布底部（y 200+），中段爬升，右端收到 30。
         刻意让左半段几乎贴着底边走：稿子里缎带是「从右下角升向右上角」的一束，
         左半段基本不可见，若左端就抬到画布中部，它会变成一道横贯的色带。 -->
    <path
      d="M0 220 C 250 216, 430 198, 592 170 C 742 144, 862 112, 982 82 C 1070 60, 1128 44, 1200 30 L 1200 220 Z"
      fill="#4a91ff"
      fill-opacity="0.22"
    />
    <!-- 发光描边：稿子里亮带上沿那道更亮的线。单独一层而不是 stroke，
         因为 stroke 会沿闭合路径的下边缘也画一圈，那圈线贴着画布底边是穿帮的。 -->
    <path
      d="M0 220 C 250 216, 430 198, 592 170 C 742 144, 862 112, 982 82 C 1070 60, 1128 44, 1200 30"
      stroke="#7fb2ff"
      stroke-opacity="0.62"
      stroke-width="1.6"
      fill="none"
    />
    <!-- 内侧高光：主带自身的上沿还有一道更细、更淡的亮线，位置略低于主描边。 -->
    <path
      d="M150 220 C 380 210, 540 190, 690 162 C 830 136, 930 110, 1032 84 C 1096 68, 1140 56, 1180 46"
      stroke="#7fb2ff"
      stroke-opacity="0.26"
      stroke-width="1"
      fill="none"
    />
  </g>
</svg>