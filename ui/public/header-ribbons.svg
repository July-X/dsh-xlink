<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" preserveAspectRatio="none" fill="none">
  <!--
    页头缎带（设计稿 2026-10-10 的两套稿）。

    形状取自稿子右上角那一片 S 形柔光：一条**有明确上边缘的色带**，左端低而平
    （先微微下沉、几乎贴着画布底边），中段陡然抬升，右端收窄并冲出画面右上角；
    带上沿有一道更亮的发光描边，下方拖一层更宽更暗的色带做出厚度。

    **它不是一团径向光晕**：先前按 token 规范的 header glow 做成
    radialGradient(ellipse at 85% 0%)，渲染出来是一个没有边缘的椭圆色块，与稿子里
    「有明确上边缘曲线的丝带」是两回事。CSS 渐变也画不出「上下两条边界、边界
    自身是 S 形」的封闭色带，用多层渐变去凑只会得到渐隐的边而不是收口的边。

    画布 640x170（此前是 1200x220）：那一版的左半段压在画布底边之外，实际渲染
    出来只有右上角一小截蓝边，与稿子里「横跨右上角约三分之一宽」的一片对不上。
    这一版把可见形态全部收进画布内，CSS 侧按容器整幅铺开。

    preserveAspectRatio="none" + CSS 侧的 `100% 100%`：容器比例与画布比例不同，
    这里是**有意拉伸**的。缎带是柔和装饰，少量横向拉伸不会让 S 形读成别的东西，
    而换成 meet 会在容器里留出一圈空白，那才会看出来。

    **颜色写死，不走 currentColor**：这个文件经 background-image 的 url() 引用，
    那条路上没有 color 继承，currentColor 会解析成黑色，整块缎带变成黑影。
    亮色主题需要更淡的一档，但那时整条缎带已被 opacity 一起压掉（见 theme.css），
    不必也不该在这里再分叉一套颜色。

    **注释里不许出现连续的连字符**：XML 把两个连字符当成注释终止符，中文破折号
    与 token 名里那两处连字符都会让整个文件变成非法 XML，浏览器静默不渲染它。
  -->
  <g>
    <!-- 后层：更宽、铺得更低，在主带下方拖出厚度。末端收得更靠右，让主带压在上面。 -->
    <path
      d="M0 170 C 130 166, 250 152, 358 124 C 452 100, 540 66, 640 22 L 640 170 Z"
      fill="#4a91ff"
      fill-opacity="0.16"
    />
    <!-- 主缎带：上边缘走 S 形。左端贴着画布底部，中段爬升，右端收到 28。
         左半段刻意压得低：稿子里缎带是「从右下角升向右上角」的一束，左半段基本
         不可见，若左端就抬到画布中部，它会变成一道横贯整页的色带。 -->
    <path
      d="M0 170 C 140 165, 262 149, 368 120 C 462 95, 548 62, 640 28 L 640 170 Z"
      fill="#4a91ff"
      fill-opacity="0.26"
    />
    <!-- 发光描边：稿子里亮带上沿那道更亮的线。单独一层而不是 stroke，
         因为 stroke 会沿闭合路径的下边缘也画一圈，那圈线贴着画布底边是穿帮的。 -->
    <path
      d="M0 170 C 140 165, 262 149, 368 120 C 462 95, 548 62, 640 28"
      stroke="#7fb2ff"
      stroke-opacity="0.7"
      stroke-width="1.4"
      fill="none"
    />
    <!-- 内侧高光：主带自身的上沿还有一道更细、更淡的亮线，位置略低于主描边。 -->
    <path
      d="M70 170 C 200 163, 316 146, 420 116 C 508 91, 580 62, 640 40"
      stroke="#7fb2ff"
      stroke-opacity="0.28"
      stroke-width="1"
      fill="none"
    />
  </g>
</svg>