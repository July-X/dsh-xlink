<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" preserveAspectRatio="xMidYMid slice" fill="none">
  <!--
    页头装饰：一条跃起的鲸鱼尾（用户 2026-10-10：「背景缎带效果调整为 DeepSeek
    鲸鱼的鱼尾形状，是一个跃起的鱼尾形状」）。

    此前这里是一条 S 形柔光缎带，设计稿原稿也是那种柔和的波浪。换成鱼尾是有理由的：
    那一版是一片没有明确主体的蓝光，而项目自己就有鲸鱼标识，页头用同一种形体，
    整屏才读成同一个产品。

    形状怎么来的：取 DeepSeek 鲸鱼尾鳍剪影的三个特征，尾柄沉在画布下边、两个尾叶
    向上张开、中间一个 V 形缺刻。尾柄沉出画布下边是「跃起」的关键，读成一条从水里
    抬起来的尾巴，而不是一只浮在角上的海豚鳍。缺刻压到 62 深、横向张 304，再浅就并
    成一块实心剪影、再深就散成两片互不相干的鳍。

    preserveAspectRatio 从 none 改成 xMidYMid slice：缎带是柔和色带，被横向拉扁
    （容器 520x170 / 画布 640x170）也看不出；鱼尾是可辨认的字形，拉扁 0.81 倍会让
    尾叶不对称，所以改用 slice 等比铺满后居中裁掉两侧各 60px。形全部画在 x 60..580
    之间，裁切不会碰到轮廓。

    颜色写死，不走 currentColor：这个文件经 background-image 的 url() 引用，那条路上
    没有 color 继承，currentColor 会解析成黑色，整条尾巴变成黑影。亮色主题靠 theme.css
    的 opacity 统一压（那边 0.62，暗色 1），不必在这里分叉两套颜色。

    注释里不许出现连续的连字符：XML 把两个连字符当成注释终止符，中文破折号与 token
    名里那几处连字符都会让整个文件变成非法 XML，浏览器静默不渲染它。
  -->
  <defs>
    <!-- 柔光晕：同一条尾巴放大后高斯模糊。纯装饰，模糊半径大一点也不费性能。 -->
    <filter id="tail-halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <!-- 纵向淡出：尾叶最实，越往下越透，到画布下边收干净。
         鱼尾是硬边字形，不做这层的话它是一块实心剪影，压在卡片上方像一顶王冠；
         有了它才回到「缎带」的读法——尾巴从卡片后面升起来、尾巴尖端化进夜色。
         第二档不推到 0，是为了保住缺刻那条亮边。 -->
    <linearGradient id="tail-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="tail-mask">
      <rect x="0" y="0" width="640" height="170" fill="url(#tail-fade)" />
    </mask>
  </defs>

  <g mask="url(#tail-mask)">
    <!-- 尾巴本体。左右对称，中轴 x=320；尾柄从 y=172 直接冲出画布下边。
         尾叶是**后掠的**：后缘的控制点刻意向中轴收，于是两片尾叶读成后掠的鳍而不是
         两团圆鼓包。第一版就是败在这里，后缘外凸，整条尾巴读成一只张开的翅膀。
         尾尖各用一段 Q 收成圆头而不是尖角——尖角在 0.2 的不透明度下会读成两支角，
         圆头才读成鳍。缺刻压到 76 深、横向张 336，柄口收到 40 宽。 -->
    <path
      d="M152 24 Q147 30 152 37 C212 61, 272 83, 320 97 C368 83, 428 61, 488 37 Q493 30 488 24 C468 78, 420 118, 366 142 C350 150, 342 162, 340 172 L300 172 C298 162, 290 150, 274 142 C220 118, 172 78, 152 37 Z"
      fill="#4a91ff"
      fill-opacity="0.17"
    />
    <!-- 柔光晕：同一路径，模糊后压到很低的一层。缎带那版靠两层路径叠厚度，鱼尾是
         硬边字形，叠层只会叠出一条更粗的边，所以改成向外扩散的辉光。 -->
    <path
      d="M152 24 Q147 30 152 37 C212 61, 272 83, 320 97 C368 83, 428 61, 488 37 Q493 30 488 24 C468 78, 420 118, 366 142 C350 150, 342 162, 340 172 L300 172 C298 162, 290 150, 274 142 C220 118, 172 78, 152 37 Z"
      fill="#4a91ff"
      fill-opacity="0.32"
      filter="url(#tail-halo)"
    />
    <!-- 缺刻的亮边：把 V 形那条线单独描一遍。深蓝大面上没有它，尾叶会读成两块
         蓝色三角而不是一条尾巴。尾尖那两段圆头一起描进去，描边才不会在尖端断掉。 -->
    <path
      d="M152 24 Q147 30 152 37 C212 61, 272 83, 320 97 C368 83, 428 61, 488 37 Q493 30 488 24"
      stroke="#7fb2ff"
      stroke-opacity="0.42"
      stroke-width="1.4"
      fill="none"
    />
    <!-- 甩出画布的两道水痕：画在尾叶**外侧**，顺着抬起方向往后拉。它们是「跃起」的
         唯一动态线索，画在身体里会被同色的填充吃掉。 -->
    <path
      d="M134 47 C106 67, 90 97, 86 129"
      stroke="#7fb2ff"
      stroke-opacity="0.18"
      stroke-width="1.3"
      fill="none"
    />
    <path
      d="M506 47 C534 67, 550 97, 554 129"
      stroke="#7fb2ff"
      stroke-opacity="0.18"
      stroke-width="1.3"
      fill="none"
    />
  </g>
</svg>