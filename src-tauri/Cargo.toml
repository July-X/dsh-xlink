[package]
name = "dsh-xlink"
version = "0.1.3-rc.1"
description = "DeepSeek Harness desktop shell: kernel version management and the bundled web UI"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` 特性暴露 `WebviewBuilder` / `WindowBuilder`（裸窗口）/
# `Window::add_child` —— 分页官方对话窗口所需的多 webview 单窗口原语
# （一个 chrome 条带 webview + N 个内容 webview 共存于同一窗口）。
# 锁定在 tauri 2.11.x，将 unstable API 变动风险限制在一次 tauri 升级内。
# `macos-private-api` 打开 wry 的 `transparent` 特性，从而允许把
# WKWebView 的私有 `drawsBackground` 关掉。没有它时 WKWebView 在文档
# 首帧之前一律绘制纯白，`background_color` 在 macOS 上完全看不到效果
# （窗口底色被 webview 盖住）——这正是工作台/官方对话加载期刺眼白闪
# 的成因。需配合 tauri.conf.json 的 `app.macOSPrivateApi: true`。
# 仅影响 macOS；我们通过 DMG 自行分发，不受 App Store 私有 API 审核约束。
# `tray-icon` 提供 Windows 通知区域图标（`tray.rs`），让管理面板可以
# 「关闭即收起后台」。图标用 `include_image!` 在编译期解码成 RGBA，
# 运行时不需要图片解码依赖。
tauri = { version = "2", features = ["unstable", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 补丁应用/撤销的内容校验（state.json 记录修改后文件哈希）。
sha2 = "0.10"
# 显式再导出 Tauri 2.x 经 `tauri::Url` 引入的 URL crate；
# 在此锁定版本，使 `Url::parse` 解析无歧义。
url = "2"
# 通过 rustls 走 HTTPS（ureq 3.x 的特性名是 `rustls` 而非 `tls`）：无系统
# TLS 依赖，因此在 Intel macOS 与 Windows 的 CI runner 上交叉编译
# 无需 C 工具链。
# 刻意**不**开启 `gzip` 特性：ureq 的 `LimitReader` 位于解压器内层，压缩响应
# 会让 `MAX_HTTP_BODY_BYTES` / `MAX_TARBALL_BYTES` 只约束压缩后的字节数——一个
# 9.9 MiB 的 gzip 炸弹可以解出数十 GB 并触发 OOM abort（整个壳连同正在跑的
# 内核一起消失）。不带该特性时 ureq 不会声明 `Accept-Encoding`，服务器也就
# 不会压缩。
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
flate2 = "1"
tar = "0.4"
# Windows 上解压官方 node 发行 zip（node.exe + npm 树）；沿用严格路径校验。
zip = { version = "2", default-features = false, features = ["deflate"] }
# `time` 支撑 `process::RotatingLog` 的本地日期日志轮转。该 crate 已作为
# 传递依赖存在于 lockfile 中；直接声明它可避免手写 libc::localtime_r 与
# GetLocalTime 的兼容层，并让文件名日期戳与用户的日历日保持一致——
# 即使是跨过 UTC 午夜。
time = { version = "0.3", default-features = false, features = ["formatting", "local-offset", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows：把内核放进 "kill on job close" 的 Job Object，让壳崩溃 / 被强杀时
# 内核随 Job 句柄关闭一起被系统终止。这是 Windows 上唯一不需要读 PEB（或
# 需要管理员权限）的孤儿回收手段，见 process.rs 的 job_object 模块（P2-2）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
# Full LTO with one codegen unit makes CI release linking disproportionately slow.
# Thin LTO and more units retain optimized binaries while shortening cold builds.
lto = "thin"
codegen-units = 16
