# 日常提交的轻量门禁。发布 workflow（desktop-release.yml）只在打 tag 时运行，
# 因此在此之前没有任何东西检查 push / PR —— 一个破坏 lint 或测试的提交要等到
# 发版才第一次被拦住（P2-52）。这里复用同一套门禁步骤，不涉及签名与发布。
name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行直接取消：CI 只关心最新一次提交。
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # 版本由 package.json 的 `packageManager` 单点决定；两处同时写会让
      # action 报 `Multiple versions of pnpm specified` 并让整个 job 失败
      # （2026-10-12 的 v0.4.7 发布就是这样三个 job 全挂在这一步）。
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare builtin plugin resources
        # src-tauri/resources/builtin-plugins/ 是构建期产物（.gitignore 挡住），
        # 但 tauri.conf.json 的 bundle.resources 按目录映射引用它 —— 少这一步，
        # 下一个 cargo 命令就在 build script 里死于
        # `resource path 'resources/builtin-plugins' doesn't exist`，
        # 表现为 cargo test / clippy / tauri build 三处同时红，且报错与真正
        # 原因隔着两层。2026-10-09 发 v0.4.4 时就是这样：quality gates 的
        # cargo test 与两个平台的构建同时挂在这一行上。
        run: pnpm run prep:builtin

      - name: Check cross-file invariants
        # 命令注册/白名单/capability/内置补丁清单/三处版本号一致性。
        run: pnpm run check:invariants

      - name: Check code budget
        # 生产代码行数预算 + 重复区间数：拦住「这个模块又胖了一圈」，
        # 要涨必须在同一个提交里改 scripts/check-code-budget.mjs 的数字。
        run: pnpm run check:code-budget

      - name: Check embedded WebDriver gating
        # 内嵌 WebDriver 插件（app 进程内的本机 HTTP 自动化端口）绝不能进
        # release 产物。这一步只跑**源码层**判据（不需要编译，秒级）；
        # 真正的产物层判据（读 cargo 指纹确认这次构建链接了谁）放在
        # desktop-release.yml 的 build job 里——那里才刚跑完 release 编译。
        run: pnpm run check:webdriver-gating

      - name: Run UI tests
        run: pnpm run test:ui

      - name: Run script test suites
        run: pnpm run test:scripts

      # 内置插件的纯函数测试（含 xlink-memory 的注入预算状态机）。此前只挂在本地
      # `npm run check` 上、两个 workflow 都没跑，于是记忆插件那一半在 CI 上完全
      # 没有网：装配层与参数名契约改错了本地全绿、进 main，到真机才炸。它只用
      # `node:test`，不装额外依赖。
      - name: Run builtin plugin test suites
        run: pnpm run test:plugin

      - name: Smoke-test the pull-string launcher
        run: node scripts/smoke-pullstring.mjs

      - name: Build UI
        run: pnpm run build:ui

      - name: Enforce UI bundle budgets
        # 判据本体在 scripts/check-ui-bundle-budget.mjs：此前这段 heredoc 在
        # 本文件与 desktop-release.yml 各内联一份，已经漂移过一次（review M12）。
        run: node scripts/check-ui-bundle-budget.mjs

      # cargo fmt 不接受 --locked（它是纯格式化器，不解析依赖图），因此下面
      # 只有 test / clippy / check 三处带 --locked。作用是让「实际编译与打包
      # 用的依赖集」必须等于仓库里被 review 过的 Cargo.lock——此前全线裸跑，
      # 依赖可以在无人察觉的情况下漂移。
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  # Windows 专属代码（托盘、Job Object、PowerShell 进程查询、反斜杠路径处理、
  # `%ComSpec% /C` 分支）在 macOS 上一次也不会被编译。只靠发布流水线发现问题的
  # 代价已经付过：rc.19 当天连续两次 Windows 编译失败，每次都要重新打 tag 并白烧
  # 一轮双平台构建（P2-16）。
  #
  # **2026-10-15（F6 验收）起，这里除了编过还要跑**：此前只有 `cargo check
  # --all-targets`，于是 `cfg(target_os = "windows")` 那一半的**行为**从来没被执行
  # 过——本仓真的栽过：两条路径归一用例把 `fs::canonicalize` 的原始结果当期望值，
  # 在 Windows 上必红，却因为「CI 只编不跑」一直绿着。验收当天在那台机器上跑了
  # 全量 `npm run check`（全绿），并把这个 job 的 check 换成 `cargo test --locked`：
  # `cargo test` 编译的目标覆盖 `--all-targets` 的那些（本 crate 没有 bench /
  # example），所以是**取代不是叠加**。仍然不签名、不打包；前端产物只需要存在一个
  # dist 目录，tauri-build 会校验 `frontendDist` 路径，因此先造一个最小 index.html。
  windows-compile:
    name: Windows compile + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ci-windows-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Provide a minimal frontendDist
        shell: bash
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><html><body></body></html>\n' > ui/dist/index.html

      - name: Prepare builtin plugin resources
        # 本 job 刻意不装 pnpm（只用 node 内置模块够跑），所以直调脚本本体。
        # build script 校验的是 tauri.conf.json 里登记的全部 bundle.resources，
        # 不只是 frontendDist——少这一步，下面那条 cargo 命令会与 quality job
        # 同样死于 `resource path 'resources/builtin-plugins' doesn't exist`。
        shell: bash
        run: node scripts/prepare-builtin-plugins.mjs

      - name: Run Rust tests on Windows
        # 判据口径与本地 `npm run check` 的 check:rust 一致（`--locked`），只是不带
        # clippy：Windows 上再跑一次 clippy 是另一次全量编译，真需要时再加。
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
