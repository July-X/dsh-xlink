# 日常提交的轻量门禁。发布 workflow（desktop-release.yml）只在打 tag 时运行，
# 因此在此之前没有任何东西检查 push / PR —— 一个破坏 lint 或测试的提交要等到
# 发版才第一次被拦住（P2-52）。这里复用同一套门禁步骤，不涉及签名与发布。
name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行直接取消：CI 只关心最新一次提交。
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check cross-file invariants
        # 命令注册/白名单/capability/内置补丁清单/三处版本号一致性。
        run: pnpm run check:invariants

      - name: Check code budget
        # 生产代码行数预算 + 重复区间数：拦住「这个模块又胖了一圈」，
        # 要涨必须在同一个提交里改 scripts/check-code-budget.mjs 的数字。
        run: pnpm run check:code-budget

      - name: Run UI tests
        run: pnpm run test:ui

      - name: Run script test suites
        run: pnpm run test:scripts

      - name: Smoke-test the pull-string launcher
        run: node scripts/smoke-pullstring.mjs

      - name: Build UI
        run: pnpm run build:ui

      - name: Enforce UI bundle budgets
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const assets = 'ui/dist/assets';
          const totalBytes = (suffix) =>
            readdirSync(assets)
              .filter((name) => name.endsWith(suffix))
              .reduce((total, name) => total + statSync(`${assets}/${name}`).size, 0);
          const jsBytes = totalBytes('.js');
          const cssBytes = totalBytes('.css');

          console.log(`UI JavaScript: ${jsBytes} bytes (budget: 700000)`);
          console.log(`UI CSS: ${cssBytes} bytes (budget: 180000)`);
          if (jsBytes > 700000 || cssBytes > 180000) {
            process.exitCode = 1;
          }
          NODE

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Windows 专属代码（托盘、Job Object、PowerShell 进程查询、反斜杠路径处理、
  # `%ComSpec% /C` 分支）在 macOS 上一次也不会被编译。只靠发布流水线发现问题的
  # 代价已经付过：rc.19 当天连续两次 Windows 编译失败，每次都要重新打 tag 并白烧
  # 一轮双平台构建（P2-16）。
  #
  # 这里只做 `cargo check --all-targets`（编译期正确性），不签名、不打包、不跑
  # 测试：目标是"Windows 代码至少能编过"。前端产物只需要存在一个 dist 目录，
  # tauri-build 会校验 `frontendDist` 路径，因此先造一个最小 index.html。
  windows-compile:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ci-windows-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Provide a minimal frontendDist
        shell: bash
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><html><body></body></html>\n' > ui/dist/index.html

      - name: Check Windows-only code paths
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
