# 日常提交的轻量门禁。发布 workflow（desktop-release.yml）只在打 tag 时运行，
# 因此在此之前没有任何东西检查 push / PR —— 一个破坏 lint 或测试的提交要等到
# 发版才第一次被拦住（P2-52）。这里复用同一套门禁步骤，不涉及签名与发布。
name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行直接取消：CI 只关心最新一次提交。
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本由 package.json 的 `packageManager` 单点决定；两处同时写会让
      # action 报 `Multiple versions of pnpm specified` 并让整个 job 失败
      # （2026-10-12 的 v0.4.7 发布就是这样三个 job 全挂在这一步）。
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ci-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare builtin plugin resources
        # src-tauri/resources/builtin-plugins/ 是构建期产物（.gitignore 挡住），
        # 但 tauri.conf.json 的 bundle.resources 按目录映射引用它 —— 少这一步，
        # 下一个 cargo 命令就在 build script 里死于
        # `resource path 'resources/builtin-plugins' doesn't exist`，
        # 表现为 cargo test / clippy / tauri build 三处同时红，且报错与真正
        # 原因隔着两层。2026-10-09 发 v0.4.4 时就是这样：quality gates 的
        # cargo test 与两个平台的构建同时挂在这一行上。
        run: pnpm run prep:builtin

      # 本地与两条 workflow 共用同一份清单；release 编译由平台打包 job 负责。
      - name: Check JavaScript, plugins and UI bundle
        run: pnpm run check:js

      - name: Check Rust formatting, tests and Clippy
        run: pnpm run check:rust:ci

  # Windows 专属代码（托盘、Job Object、PowerShell 进程查询、反斜杠路径处理、
  # `%ComSpec% /C` 分支）在 macOS 上一次也不会被编译。只靠发布流水线发现问题的
  # 代价已经付过：rc.19 当天连续两次 Windows 编译失败，每次都要重新打 tag 并白烧
  # 一轮双平台构建（P2-16）。
  #
  # **2026-10-15（F6 验收）起，这里除了编过还要跑**：此前只有 `cargo check
  # --all-targets`，于是 `cfg(target_os = "windows")` 那一半的**行为**从来没被执行
  # 过——本仓真的栽过：两条路径归一用例把 `fs::canonicalize` 的原始结果当期望值，
  # 在 Windows 上必红，却因为「CI 只编不跑」一直绿着。验收当天在那台机器上跑了
  # 全量 `npm run check`（全绿），并把这个 job 的 check 换成 `cargo test --locked`：
  # `cargo test` 编译的目标覆盖 `--all-targets` 的那些（本 crate 没有 bench /
  # example），所以是**取代不是叠加**。仍然不签名、不打包；前端产物只需要存在一个
  # dist 目录，tauri-build 会校验 `frontendDist` 路径，因此先造一个最小 index.html。
  windows-compile:
    name: Windows compile + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: ci-windows-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Provide a minimal frontendDist
        shell: bash
        run: |
          mkdir -p ui/dist
          printf '<!doctype html><html><body></body></html>\n' > ui/dist/index.html

      - name: Prepare builtin plugin resources
        # 本 job 刻意不装 pnpm（只用 node 内置模块够跑），所以直调脚本本体。
        # build script 校验的是 tauri.conf.json 里登记的全部 bundle.resources，
        # 不只是 frontendDist——少这一步，下面那条 cargo 命令会与 quality job
        # 同样死于 `resource path 'resources/builtin-plugins' doesn't exist`。
        shell: bash
        run: node scripts/prepare-builtin-plugins.mjs

      - name: Run Rust tests on Windows
        # 判据口径与本地 `npm run check` 的 check:rust 一致（`--locked`），只是不带
        # clippy：Windows 上再跑一次 clippy 是另一次全量编译，真需要时再加。
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
