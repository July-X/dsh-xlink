# 为支持的桌面目标构建并发布 dsh-xlink 外壳。
# 版本发布从独立项目的 main 分支构建。
#
# 所有 `uses:` 都固定到 40 位 commit SHA（后缀注释是它对应的版本）。
# build job 会把 TAURI_SIGNING_PRIVATE_KEY 放进 `tauri build` 步骤的环境里，
# 因此一个被投毒或被重指 tag 的第三方 action 足以读走更新签名私钥——那等于
# 让攻击者可以为任意载荷签名，所有已安装用户都会通过验签。Dependabot 负责
# 提出升级 PR（它会同时更新 SHA 与注释）。

name: Desktop release (dsh-xlink)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

# 固定的并发组：以 `github.ref` 分组会让 tag push（refs/tags/…）与手动
# dispatch（refs/heads/main）落进**两个不同的组**，同一个版本因此可以并发跑
# 两条完整流水线；后启动的那条会在 publish 的「Create or reuse release」步骤
# 上撞车失败——白烧 20~30 分钟的双平台构建（rc.7 与 rc.13 都真实发生过）。
# 发布频率很低，串行化的代价可以忽略。
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: macos-15-intel
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Validate source and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "desktop releases only run on main; dispatched ref was $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "commit $GITHUB_SHA does not belong to main" >&2
            exit 1
          fi

          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          if [[ "$version" != "$tauri_version" ]]; then
            echo "version mismatch: package.json=$version, tauri.conf.json=$tauri_version" >&2
            exit 1
          fi

          # Cargo.toml 的 version 是 `CARGO_PKG_VERSION` 的来源，而它被
          # releases.rs 当作对外 User-Agent（dsh-xlink/<版本>）；漏同步会让外壳
          # 对 npm registry / GitHub 自称另一个版本。这里一并校验。
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "version mismatch: package.json=$version, src-tauri/Cargo.toml=$cargo_version" >&2
            exit 1
          fi

          tag="desktop-v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          fi

          existing_tag="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
          if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
            echo "tag $tag already points to $existing_tag, expected $GITHUB_SHA" >&2
            exit 1
          fi

          # 更新通道单调性：`releases/latest` 取的是「最近创建的非 draft 非
          # prerelease release」，而不是 semver 最大值。给旧线发一个 hotfix 会让
          # 端点后退，而 Tauri 只在 `release.version > current_version` 时提示
          # 更新——已经装上新版本的用户从此静默收不到任何更新提示，且没有任何
          # 步骤能发现。所以发布前就断言新版本严格大于线上最新版本。
          # 只有"确实还没有 Release"（404）才允许跳过；其它失败（超时、5xx、
          # CDN 抖动、JSON 里没有 version）必须重试后失败——在异常时刻静默跳过，
          # 恰好丢掉这道门唯一要防的东西（更新通道回退，P2-14）。
          latest_url="https://github.com/July-X/dsh-xlink/releases/latest/download/latest.json"
          published=""
          http_code=""
          for attempt in 1 2 3; do
            body_file="$(mktemp)"
            http_code="$(curl -sSL --max-time 20 -o "$body_file" -w '%{http_code}' "$latest_url" || echo 000)"
            if [[ "$http_code" == "200" ]]; then
              published="$(node -e "let s='';process.stdin.on('data',(c)=>s+=c).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||''))}catch{}})" < "$body_file")"
              rm -f "$body_file"
              break
            fi
            rm -f "$body_file"
            if [[ "$http_code" == "404" ]]; then
              break
            fi
            echo "读取线上 latest.json 失败（HTTP $http_code，第 $attempt 次）" >&2
            sleep 5
          done
          if [[ "$http_code" == "404" ]]; then
            echo "线上还没有 Release（首次发布），跳过版本单调性检查"
          elif [[ -z "$published" ]]; then
            echo "无法确认线上 latest.json 的版本（HTTP $http_code）：拒绝在无法验证更新通道单调性的情况下发布" >&2
            exit 1
          else
            CANDIDATE="$version" PUBLISHED="$published" node -e '
              const parse = (v) => {
                const [head, pre = ""] = String(v).replace(/^v/, "").split("-");
                return [head.split(".").map((n) => Number(n) || 0), pre];
              };
              const compare = (a, b) => {
                const [na, pa] = parse(a);
                const [nb, pb] = parse(b);
                for (let i = 0; i < Math.max(na.length, nb.length); i += 1) {
                  const delta = (na[i] || 0) - (nb[i] || 0);
                  if (delta !== 0) return delta;
                }
                if (pa === pb) return 0;
                if (!pa) return 1;
                if (!pb) return -1;
                const xa = pa.split(".");
                const ya = pb.split(".");
                for (let i = 0; i < Math.max(xa.length, ya.length); i += 1) {
                  const x = xa[i];
                  const y = ya[i];
                  if (x === undefined) return -1;
                  if (y === undefined) return 1;
                  const nx = /^[0-9]+$/.test(x);
                  const ny = /^[0-9]+$/.test(y);
                  if (nx && ny) {
                    if (Number(x) !== Number(y)) return Number(x) - Number(y);
                  } else if (nx !== ny) {
                    return nx ? 1 : -1;
                  } else if (x !== y) {
                    return x < y ? -1 : 1;
                  }
                }
                return 0;
              };
              const candidate = process.env.CANDIDATE;
              const published = process.env.PUBLISHED;
              if (compare(candidate, published) <= 0) {
                console.error(
                  "版本单调性检查失败：待发布 " + candidate + " 不大于线上最新 " + published + "。",
                  "GitHub 的 releases/latest 取「最近创建」而非 semver 最大值，发布较低版本会让",
                  "/releases/latest 后退，已经装上新版本的用户从此收不到更新提示。"
                );
                process.exit(1);
              }
              console.log("版本单调性检查通过：" + published + " → " + candidate);
            '
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gates
    needs: preflight
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: quality-${{ runner.os }}-${{ runner.arch }}
          # GitHub scopes caches by ref. Only main can provide a cache shared
          # by future manual releases; tag-scoped saves add upload time but
          # cannot be restored by the next version's tag.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check cross-file invariants
        run: pnpm run check:invariants

      - name: Run UI tests
        run: pnpm run test:ui

      - name: Run script test suites
        # 一次覆盖 scripts/*.test.mjs 的全部用例（标题栏注入、发布清单、
        # 资产归一化、依赖安装脚本的输出透传）；以后新增脚本测试不必再逐个
        # 往 workflow 里补步骤。
        run: pnpm run test:scripts

      - name: Smoke-test the pull-string launcher
        run: node scripts/smoke-pullstring.mjs

      - name: Build UI
        run: pnpm run build:ui

      - name: Enforce UI bundle budgets
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const assets = 'ui/dist/assets';
          const totalBytes = (suffix) =>
            readdirSync(assets)
              .filter((name) => name.endsWith(suffix))
              .reduce((total, name) => total + statSync(`${assets}/${name}`).size, 0);
          const jsBytes = totalBytes('.js');
          const cssBytes = totalBytes('.css');

          console.log(`UI JavaScript: ${jsBytes} bytes (budget: 700000)`);
          console.log(`UI CSS: ${cssBytes} bytes (budget: 180000)`);
          if (jsBytes > 700000 || cssBytes > 180000) {
            process.exitCode = 1;
          }
          NODE

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: macos-intel
            platform: macos-15-intel
          - name: windows-x86_64
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          # Keep release caches in the main branch scope so later manual
          # dispatches can restore them across version tags.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify signing key pair
        # Windows runner 默认 shell 是 PowerShell，而这一步用的是 bash 语法；
        # 显式声明 shell 让两个平台走同一份脚本（首次真实运行就是这么挂的）。
        shell: bash
        # 只换一半密钥（轮换了私钥但没同步 tauri.conf.json 里的 updater 公钥）
        # 会发布出所有客户端都验签失败的更新，而且直到用户点「检查更新」才暴露。
        # 这里用私钥签一个测试载荷、再用配置里的公钥验签，把事故拦在打包之前
        # （P2-51）。放在构建之前，失败就不用白等一次完整打包。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY，跳过签名密钥成对校验"
            exit 0
          fi
          pnpm exec node scripts/check-signing-keys.mjs

      - name: Build signed desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build

      - name: Normalize macOS updater asset names
        if: matrix.name == 'macos-intel'
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/normalize-release-assets.mjs \
            --bundle-dir src-tauri/target/release/bundle \
            --version "$RELEASE_VERSION"

      - name: Upload macOS release assets
        if: matrix.name == 'macos-intel'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}-${{ needs.preflight.outputs.version }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows release assets
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}-${{ needs.preflight.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs: [preflight, quality, build]
    if: ${{ always() && needs.preflight.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' }}
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Download platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*-${{ needs.preflight.outputs.version }}
          path: artifacts
          merge-multiple: true

      - name: Normalize downloaded macOS updater asset names
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/normalize-release-assets.mjs \
            --bundle-dir artifacts \
            --version "$RELEASE_VERSION"

      - name: Generate updater metadata
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/generate-updater-manifest.mjs \
            --artifacts-dir artifacts \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --manifest latest.json \
            --notes release-notes.md

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          release_name="dsh-xlink v$RELEASE_VERSION"
          # 用 `commits/<tag>` 而不是 `git/ref/tags/<tag>`：后者对 annotated tag
          # 返回的是 **tag 对象** 的 SHA，而 tag push 事件的 `GITHUB_SHA` 是被指向的
          # **commit**。用 ref API 时 `git tag -a` 创建的 tag 会让这里在跑满质量
          # 门禁与双平台打包（20–30 分钟）之后才失败，报错还指向一个与实际原因
          # 无关的"tag 指向了别的提交"（P2-15）。`commits/<ref>` 由服务端剥壳，
          # 与 preflight 的 `^{commit}` 判定口径一致。
          tag_sha=""
          if ! tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha 2>/dev/null)"; then
            tag_sha=""
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "tag $RELEASE_TAG already points to $tag_sha, expected $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          release_metadata="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" or (.draft == true and .name == \"$release_name\")) | [.id, .draft] | @tsv")"
          if [[ "$release_metadata" == *$'\n'* ]]; then
            echo "multiple releases found for tag $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -z "$release_metadata" ]]; then
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$release_name" \
              -f body="$(<release-notes.md)" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
          else
            IFS=$'\t' read -r release_id release_draft <<< "$release_metadata"
            if [[ "$release_draft" != "true" ]]; then
              echo "release $RELEASE_TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$release_name" \
              -f body="$(<release-notes.md)" \
              -F draft=true \
              -F prerelease=false >/dev/null
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r path; do
            assets+=("$path")
          done < <(find artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' -o \
            -name '*-setup.exe' -o \
            -name '*-setup.exe.sig' \
          \) -print)
          assets+=(latest.json)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "expected five platform assets plus latest.json, found ${#assets[@]}" >&2
            exit 1
          fi
          for path in "${assets[@]}"; do
            asset_name="$(basename "$path")"
            existing_ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --paginate \
              --jq ".[] | select(.name == \"$asset_name\") | .id")"
            if [[ "$existing_ids" == *$'\n'* ]]; then
              echo "multiple existing release assets found for $asset_name" >&2
              exit 1
            fi
            if [[ -n "$existing_ids" ]]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_ids}" \
                >/dev/null
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --header 'Content-Type: application/octet-stream' \
              --raw-field "name=$asset_name" \
              --input "$path" \
              >/dev/null
          done

      - name: Normalize draft assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail

          # 资产集合的整理与断言必须在**转正之前**完成（P2-13）：转正之后再删
          # 资产，一旦后续任何一步失败，就已经对外可见的 Release 被就地改动，
          # 而且重跑会被"already published"与版本单调性门拦住——只能人工上
          # Release 页面收拾。草稿态下同样的操作是安全且可重入的。
          # 1) 正式 Release 的资产必须恰好 6 个。上传前只按**文件名**删同名资产、
          #    从没读回过 Release 的实际列表；复用人工建过的 draft 时可能留下命名
          #    不同的旧资产，而资产计数只数本地目录，发现不了。
          #
          #    因此这里读回真实集合，并且**直接把计划外资产删掉**（P2-46）：只断言
          #    数量会让"人工往 draft 里放过一个 dsh-xlink-<旧版本>.dmg"这类事故
          #    变成红灯，需要人工去 Release 页面清理；发布脚本自己能做到的就不要
          #    留给人。白名单来自本次实际产出的文件名（artifacts 目录）加上
          #    latest.json。
          #    （macOS runner 是 bash 3.2，没有 mapfile，只能用 while read 累加。）
          expected_names=()
          while IFS= read -r name; do
            [[ -n "$name" ]] && expected_names+=("$name")
          done < <(find artifacts -type f -exec basename {} \; | sort -u)
          expected_names+=("latest.json")

          is_expected() {
            local candidate="$1"
            local known
            for known in "${expected_names[@]}"; do
              [[ "$candidate" == "$known" ]] && return 0
            done
            return 1
          }

          # 资产 id 与名字分两次取值、按下标一一对应：合成一行再用 IFS 切分
          # 在 bash 3.2 下很容易踩到制表符/字面量的坑（本地干跑就撞上了），
          # 而这里两个查询各自都是单列、无空格，读起来也简单。
          ids=()
          while IFS= read -r id; do
            [[ -n "$id" ]] && ids+=("$id")
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --paginate --jq '.[].id')

          current_names=()
          while IFS= read -r name; do
            [[ -n "$name" ]] && current_names+=("$name")
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --paginate --jq '.[].name')

          removed=0
          index=0
          while [[ "$index" -lt "${#current_names[@]}" ]]; do
            asset_name="${current_names[$index]}"
            asset_id="${ids[$index]:-}"
            index=$((index + 1))
            if is_expected "$asset_name"; then
              continue
            fi
            if [[ -z "$asset_id" ]]; then
              echo "unexpected asset ${asset_name} has no id; cannot delete it" >&2
              exit 1
            fi
            echo "deleting unexpected release asset: ${asset_name} (id ${asset_id})" >&2
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
            removed=$((removed + 1))
          done

          if [[ "$removed" -gt 0 ]]; then
            echo "removed ${removed} unexpected asset(s) before verifying the published set" >&2
          fi

          names=()
          while IFS= read -r name; do
            names+=("$name")
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --paginate --jq '.[].name')
          if [[ "${#names[@]}" -ne 6 ]]; then
            # `${names[*]:-}` 而不是 `${names[*]}`：macOS runner 的 bash 3.2 在
            # `set -u` 下展开空数组会直接报 unbound variable，把"资产少了"的
            # 诊断变成一句与实情无关的 shell 错误。
            echo "published release has ${#names[@]} assets, expected exactly 6: ${names[*]:-}" >&2
            exit 1
          fi
          # 删掉计划外资产之后，集合还必须与本次产出**逐个吻合**：数量对得上
          # 但名字不对（例如少了 macOS 更新包、多了同名旧文件）同样是坏发布。
          for expected in "${expected_names[@]}"; do
            found="no"
            for name in "${names[@]}"; do
              if [[ "$name" == "$expected" ]]; then
                found="yes"
                break
              fi
            done
            if [[ "$found" != "yes" ]]; then
              echo "published release is missing expected asset: ${expected}" >&2
              exit 1
            fi
          done


      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="dsh-xlink v$RELEASE_VERSION" \
            -f body="$(<release-notes.md)" \
            -F draft=false \
            -F prerelease=false >/dev/null

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          # 资产集合的整理（删计划外资产 + 恰好 6 个 + 逐名比对）已经在
          # 「Normalize draft assets before publishing」里、转正之前完成（P2-13）。
          # 这里只做转正之后才成立的检查：更新端点指向刚发布的版本，且每个平台
          # 资产真的可下载。
          # 2) 更新端点必须真的指向刚发布的版本，且每个平台资产可下载。
          #    这是「用户能不能收到更新」唯一的端到端检查：GitHub 的
          #    releases/latest 取「最近创建」而非 semver 最大值，任何把端点顶回去
          #    的发布都会在这里立刻暴露，而不是等到用户再也收不到更新才发现。
          endpoint="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          fetched=""
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$endpoint" -o published-latest.json; then
              fetched="yes"
              break
            fi
            echo "updater endpoint not ready yet (attempt ${attempt}); retrying in 10s" >&2
            sleep 10
          done
          if [[ -z "$fetched" ]]; then
            echo "updater endpoint is unreachable: $endpoint" >&2
            exit 1
          fi
          published_version="$(node -p "JSON.parse(require('fs').readFileSync('published-latest.json','utf8')).version")"
          if [[ "$published_version" != "$RELEASE_VERSION" ]]; then
            echo "updater endpoint reports $published_version, expected $RELEASE_VERSION" >&2
            exit 1
          fi
          while IFS= read -r url; do
            if [[ -z "$url" ]]; then
              continue
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$url")"
            if [[ "$code" != "200" ]]; then
              echo "update asset unreachable (HTTP $code): $url" >&2
              exit 1
            fi
          done < <(node -p "
            const manifest = JSON.parse(require('fs').readFileSync('published-latest.json','utf8'));
            Object.values(manifest.platforms || {}).map((platform) => platform.url).join('\\n')
          ")
          echo "verified: endpoint serves v${published_version}, all platform assets reachable"
