# 为支持的桌面目标构建并发布 dsh-xlink 外壳。
# 版本发布从独立项目的 main 分支构建。

name: Desktop release (dsh-xlink)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: macos-15-intel
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate source and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "desktop releases only run on main; dispatched ref was $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "commit $GITHUB_SHA does not belong to main" >&2
            exit 1
          fi

          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          if [[ "$version" != "$tauri_version" ]]; then
            echo "version mismatch: package.json=$version, tauri.conf.json=$tauri_version" >&2
            exit 1
          fi

          tag="desktop-v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          fi

          existing_tag="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
          if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
            echo "tag $tag already points to $existing_tag, expected $GITHUB_SHA" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gates
    needs: preflight
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: quality-${{ runner.os }}-${{ runner.arch }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run UI tests
        run: pnpm run test:ui

      - name: Test release manifest generator
        run: pnpm run test:release-manifest

      - name: Build UI
        run: pnpm run build:ui

      - name: Enforce UI bundle budgets
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';

          const assets = 'ui/dist/assets';
          const totalBytes = (suffix) =>
            readdirSync(assets)
              .filter((name) => name.endsWith(suffix))
              .reduce((total, name) => total + statSync(`${assets}/${name}`).size, 0);
          const jsBytes = totalBytes('.js');
          const cssBytes = totalBytes('.css');

          console.log(`UI JavaScript: ${jsBytes} bytes (budget: 700000)`);
          console.log(`UI CSS: ${cssBytes} bytes (budget: 180000)`);
          if (jsBytes > 700000 || cssBytes > 180000) {
            process.exitCode = 1;
          }
          NODE

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: macos-intel
            platform: macos-15-intel
          - name: windows-x86_64
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ runner.os }}-${{ runner.arch }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build signed desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build

      - name: Normalize macOS updater asset names
        if: matrix.name == 'macos-intel'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          macos_dir="src-tauri/target/release/bundle/macos"
          dmg_count="$(find "$macos_dir" -maxdepth 1 -type f -name '*.dmg' -print | wc -l | tr -d ' ')"
          archive_count="$(find "$macos_dir" -maxdepth 1 -type f -name '*.app.tar.gz' -print | wc -l | tr -d ' ')"
          signature_count="$(find "$macos_dir" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -print | wc -l | tr -d ' ')"
          if [[ "$dmg_count" != '1' || "$archive_count" != '1' || "$signature_count" != '1' ]]; then
            echo "expected one DMG, updater archive and signature; found $dmg_count/$archive_count/$signature_count" >&2
            exit 1
          fi

          dmg="$(find "$macos_dir" -maxdepth 1 -type f -name '*.dmg' -print)"
          archive="$(find "$macos_dir" -maxdepth 1 -type f -name '*.app.tar.gz' -print)"
          signature="$(find "$macos_dir" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -print)"
          dmg_name="${dmg##*/}"
          stem="${dmg_name%.dmg}"
          versioned_archive="$macos_dir/$stem.app.tar.gz"
          versioned_signature="$versioned_archive.sig"

          if [[ "$stem" != *"$RELEASE_VERSION"* ]]; then
            echo "macOS DMG does not contain release version $RELEASE_VERSION: $dmg_name" >&2
            exit 1
          fi
          if [[ "$archive" != "$versioned_archive" ]]; then
            mv "$archive" "$versioned_archive"
          fi
          if [[ "$signature" != "$versioned_signature" ]]; then
            mv "$signature" "$versioned_signature"
          fi

      - name: Upload macOS release assets
        if: matrix.name == 'macos-intel'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ needs.preflight.outputs.version }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows release assets
        if: matrix.name == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ needs.preflight.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs: [preflight, quality, build]
    if: ${{ always() && needs.preflight.result == 'success' && needs.quality.result == 'success' && needs.build.result == 'success' }}
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-${{ needs.preflight.outputs.version }}
          path: artifacts
          merge-multiple: true

      - name: Generate updater metadata
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/generate-updater-manifest.mjs \
            --artifacts-dir artifacts \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --manifest latest.json \
            --notes release-notes.md

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          release_metadata="$(gh api "$release_endpoint" --jq '[.id, .draft] | @tsv' 2>/dev/null || true)"
          if [[ -z "$release_metadata" ]]; then
            release_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="dsh-xlink v$RELEASE_VERSION" \
              -f body="$(<release-notes.md)" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
          else
            IFS=$'\t' read -r release_id release_draft <<< "$release_metadata"
            if [[ "$release_draft" != "true" ]]; then
              echo "release $RELEASE_TAG already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="dsh-xlink v$RELEASE_VERSION" \
              -f body="$(<release-notes.md)" \
              -F draft=true \
              -F prerelease=false >/dev/null
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r path; do
            assets+=("$path")
          done < <(find artifacts -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' -o \
            -name '*-setup.exe' -o \
            -name '*-setup.exe.sig' \
          \) -print)
          assets+=(latest.json)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "expected five platform assets plus latest.json, found ${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f name="dsh-xlink v$RELEASE_VERSION" \
            -f body="$(<release-notes.md)" \
            -F draft=false \
            -F prerelease=false >/dev/null
