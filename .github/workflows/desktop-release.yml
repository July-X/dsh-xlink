# Build and publish the dsh-desktop shell for the supported desktop targets.
# Releases are built from the independent project's main branch.

name: Desktop release (dsh-xlink)

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run UI tests
        run: pnpm run test:ui

      - name: Build UI
        run: pnpm run build:ui

      - name: Enforce UI bundle budgets
        shell: bash
        run: |
          js_bytes=$(find ui/dist/assets -type f -name '*.js' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          css_bytes=$(find ui/dist/assets -type f -name '*.css' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          echo "UI JavaScript: ${js_bytes} bytes (budget: 700000)"
          echo "UI CSS: ${css_bytes} bytes (budget: 180000)"
          if (( js_bytes > 700000 )); then
            echo "UI JavaScript bundle exceeds its budget" >&2
            exit 1
          fi
          if (( css_bytes > 180000 )); then
            echo "UI CSS bundle exceeds its budget" >&2
            exit 1
          fi

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify the tag matches the app version and sits on main
        id: meta
        shell: pwsh
        run: |
          # Releases ship only from main: a tag must name a commit that is
          # reachable from origin/main, and a manual dispatch must select main.
          if ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -ne 'main') {
            throw "desktop releases only run on main; dispatched ref was $env:GITHUB_REF_NAME"
          }
          git fetch --depth=100 origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "tag $env:GITHUB_REF_NAME does not point at a commit on main"
          }

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $pkg.version) {
            throw "version mismatch: tauri.conf.json ($($conf.version)) != package.json ($($pkg.version))"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$($conf.version)") {
            throw "tag $env:GITHUB_REF_NAME does not match desktop version $($conf.version)"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the Tauri CLI
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: desktop-v__VERSION__
          releaseName: 'dsh-xlink v__VERSION__'
          releaseBody: |
            ## dsh-xlink v__VERSION__

            支持平台：
            - Intel macOS（.dmg）
            - Windows x86_64（NSIS 安装包 .exe）

            使用方式：安装后在「内核版本」页安装并切换 DeepSeek Harness 内核版本即可使用。
          # Keep both flags false so the updater's latest endpoint resolves.
          releaseDraft: false
          prerelease: false
