	<!-- Windows 通知区域（托盘）专用主图：整条鲸鱼在 16–32px 上会把红眼压到
	     亚像素，读起来就是一坨黑色剪影。这里把镜头对准鱼头（白嘴斑 + 红眼
	     那一块），并把红眼按同一几何放大到 3 倍，让托盘图标在最小档也认得出
	     是这条鲸鱼。头部轮廓直接复用 whale-icon-small.svg 的 path，红眼与高光
	     的坐标由 (x,y) → (28.5+(x-26.96)*3, 30+(y-24.6)*3) 变换得到（缩放中心
	     落在眼睛上），配色与径向渐变与原图一致。 -->
	<!-- 白色描边：托盘区（任务栏右下角）在浅色主题下是浅色、深色主题下是深色，
	     而鲸体本身是近黑色（#0b0f1a）——深色任务栏上会糊成一片。加一圈按画布
	     比例的白描边（与嘴斑同色），两种主题下都能勾出鱼头轮廓；红眼不受影响。 -->
